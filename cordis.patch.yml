# cordis.patch.yml — DeepSeek Harness integration for dsh-obsidian.
#
# This file is what `dsh plugin --profile web add github:qiqiangvae/dsh-obsidian`
# applies to your profile. You usually do not edit this file directly; instead
# override the `config` block in your own profile's cordis.patch.yml.
#
# Minimal user-facing config (in your profile, e.g. ~/.dsh/profiles/web/cordis.patch.yml):
#
#   - id: dsh-obsidian
#     config:
#       vaultPath: /absolute/path/to/your/obsidian/vault
#
# The dsh-obsidian row below is the *default* applied when this plugin is
# installed; it intentionally has no vaultPath so the loader fails loud with
# a clear message rather than silently pointing at a non-existent path.

- id: dsh-obsidian
  bundle: ./package.json
  entry: ./lib/index.js
  config:
    # REQUIRED — set this in your profile's cordis.patch.yml override.
    vaultPath: ""
    # optional — default folders applied if you do not override
    typeFolders: {}
    # optional — cap on wiki_query hits
    maxQueryResults: 10
